<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FizzFX</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&family=JetBrains+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06090f;--bg2:#0b1018;--bg3:#10161f;--bg4:#17202d;
  --line:#1b2636;--line2:#243347;
  --txt:#dde5f0;--mut:#718499;--dim:#384d63;
  --a:#38bdf8;--a2:#0369a1;--ag:rgba(56,189,248,.13);
  --g:#34d399;--r:#f87171;
  --m:'JetBrains Mono',monospace;--s:'IBM Plex Sans',sans-serif;--num:'Cascadia Mono','Consolas','Roboto Mono','SFMono-Regular',monospace;
  --r4:4px;--r6:6px;
  --nav:52px;--lw:176px;--pw:288px;--iw:310px;
}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:var(--s);font-size:14px;overflow:hidden}
button,input,select{font:inherit}


.layout{display:grid;grid-template-columns:var(--nav) var(--pw) minmax(0,1fr) var(--iw);grid-template-rows:46px minmax(0,1fr);height:100vh;min-height:0;overflow:hidden}
.layout.inspectorClosed{grid-template-columns:var(--nav) var(--pw) minmax(0,1fr) 0}
.appTop{grid-column:1/3;grid-row:1;background:var(--bg2);border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 9px;min-width:0;overflow:hidden;z-index:20}
.appTop .fxLogo{flex:0 0 auto;margin-right:3px}
.appTop .fxLogo span{font-size:32px}
.appTop .projectGroup,.appTop .historyGroup{flex:0 0 auto}
.appTop .btn.small{padding:4px 7px}
.appTop .toolbarDivider{height:20px;margin:0 2px}


.sidenav{grid-column:1;grid-row:2;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:10px 0;gap:3px;z-index:10;flex-shrink:0}
.navIcon{position:relative;width:38px;height:38px;border-radius:var(--r6);background:transparent;border:0;color:var(--dim);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s}
.navIcon:hover{background:var(--bg3);color:var(--mut)}
.navIcon.on{background:color-mix(in srgb,var(--a) 13%,var(--bg3));color:var(--a)}
.navIcon.on::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:22px;background:var(--a);border-radius:0 3px 3px 0}
.navIcon::after{content:attr(title);position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);background:var(--bg4);border:1px solid var(--line2);color:var(--txt);font-family:var(--m);font-size:10px;padding:4px 9px;border-radius:var(--r4);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s;z-index:100}
.navIcon:hover::after{opacity:1}
.navDivider{width:28px;height:1px;background:var(--line);margin:4px 0;flex-shrink:0}


.panel{position:relative;grid-column:2;grid-row:2;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.tabs{display:none}


.panelHead{padding:14px 16px 11px;border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:baseline;gap:10px}
.panelTitle{font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--a);font-weight:600}
.panelSub{font-family:var(--m);font-size:11px;color:var(--mut)}


.inspector{position:relative;grid-column:4;grid-row:1/3;background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.layout.inspectorClosed .inspector{border-left:0}


.head{padding:14px 16px 11px;border-bottom:1px solid var(--line)}
.headRow{display:flex;align-items:center;gap:8px}.headRow h1{flex:1}
.head h1{font-family:var(--m);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--a);font-weight:600}
.head p{font-size:11px;color:var(--dim);margin-top:3px}
.inspectorSwitch{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
.inspectorSwitch .btn{width:100%;text-align:center}
.inspectorLayerPanel{display:none}
.inspector.showLayers #particlePanel{display:none}
.inspector.showLayers .inspectorLayerPanel{display:flex;flex-direction:column}
.inspector.showLayers .head h1{color:var(--a)}


.layers{display:flex;flex-direction:column;gap:5px;flex:1;min-height:0;background:var(--bg);padding:8px;overflow-y:auto;overflow-x:hidden;border-top:1px solid var(--line)}
.layerChip{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px;align-items:center;border:1px solid var(--line);border-radius:var(--r6);background:rgba(255,255,255,.02);padding:5px;transition:border-color .12s,background .12s,opacity .12s}
.layerChip.on{border-color:var(--a2);background:color-mix(in srgb,var(--a) 8%,var(--bg3))}
.layerChip.off{opacity:.46}
.layerChip.muted{opacity:.48;filter:saturate(.45)}
.layerChip.solo{border-color:#854d0e;background:rgba(250,204,21,.08)}
.layerChip.inactive{opacity:.28}
.layerGroupChip{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:5px;align-items:center;margin-top:4px;padding:5px;border:1px solid rgba(148,163,184,.08);border-radius:var(--r6);background:rgba(255,255,255,.015);transition:border-color .12s,background .12s,opacity .12s}
.layerGroupChip.on{border-color:var(--a2);background:rgba(56,189,248,.055);box-shadow:inset 0 0 0 1px rgba(56,189,248,.04)}
.layerGroupChip.muted{opacity:.5;filter:saturate(.45)}
.layerGroupChip.solo{border-color:#854d0e;background:rgba(250,204,21,.06)}
.layerGroupChip.inactive{opacity:.3}
.layerGroupToggle{width:22px;height:24px;border:0;background:transparent;color:var(--mut);font-family:var(--m);font-size:16px;line-height:1;cursor:pointer}
.layerGroupName,.layerNameLabel{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mut);font-family:var(--m);font-size:11px;text-align:left;background:transparent;border:0;cursor:pointer}
.layerGroupName:hover,.layerGroupToggle:hover{color:var(--a)}
.layerChildren{display:flex;flex-direction:column;gap:5px;margin-left:10px;padding-left:8px;border-left:1px solid rgba(148,163,184,.09)}
.layerTab{width:100%;height:28px;padding:0 7px;font-family:var(--m);font-size:11px;color:var(--mut);background:transparent;border:0;border-radius:var(--r4);cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;transition:all .12s}
.layerTab:hover{color:var(--mut);border-color:var(--line2)}
.layerTab.on{color:var(--a)}
.layerTab.solo{color:#facc15}
.layerQuickTools{display:flex;gap:3px;align-items:center;justify-content:flex-end;flex-wrap:nowrap}
.layerQuickTools .stateBtn{min-width:20px;padding:3px 5px;font-size:10px}
.layerStackActions{display:grid;grid-template-columns:1fr 1fr 30px 30px 1fr 1fr;gap:5px;padding:8px 10px;border-top:1px solid var(--line);background:var(--bg2)}
.layerStackActions .btn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layerStackActions #layerStackAdd{grid-column:1/4;grid-row:1}
.layerStackActions #layerStackGroup{grid-column:4/7;grid-row:1}
.layerStackActions #layerStackDuplicate{grid-column:1/3;grid-row:2}
.layerStackActions #layerStackUp{grid-column:3;grid-row:2}
.layerStackActions #layerStackDown{grid-column:4;grid-row:2}
.layerStackActions #layerStackDelete{grid-column:5/7;grid-row:2}
.layerStackActions #layerStackUp,.layerStackActions #layerStackDown{min-width:30px;padding-left:0;padding-right:0}
.layerStackMove{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px;align-items:center;padding:0 10px 8px;background:var(--bg2)}
.layerStackMove label{font-family:var(--m);font-size:10px;color:var(--dim)}
.layerStackMove select{min-width:0;width:100%}
.layerStackMove.isGroup{display:block;font-family:var(--m);font-size:10px;color:var(--dim)}
.layerNameInput{width:100%;height:28px;min-width:0;border:0;background:transparent;box-shadow:none;color:var(--mut);font-family:var(--m);font-size:11px;padding:0 7px}
.layerNameInput:focus{color:var(--txt);background:rgba(255,255,255,.035);border:1px solid var(--line2);box-shadow:none}
.layerChip.on .layerNameInput,.layerChip.on .layerNameLabel{color:var(--a)}
.layerChip.solo .layerNameInput,.layerChip.solo .layerNameLabel{color:#facc15}
.layerDragHint{font-family:var(--m);font-size:10px;color:var(--dim);padding:8px 10px;border-top:1px solid var(--line);background:var(--bg2)}
.addLayer{margin:3px 0 0;width:100%;min-height:30px;background:transparent;border:1px dashed var(--line2);border-radius:var(--r4);color:var(--g);cursor:pointer;font-family:var(--m);font-size:11px;display:flex;align-items:center;justify-content:center;transition:all .12s}
.addLayer:hover{background:var(--bg3);border-color:var(--g)}
.staggerViz{display:block;width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--r6);background:rgba(255,255,255,.02)}
.staggerTrack{position:relative;height:30px;border-radius:var(--r4);overflow:hidden;background:linear-gradient(90deg,rgba(56,189,248,.08),rgba(168,85,247,.06));border:1px solid rgba(148,163,184,.11)}
.staggerTrack::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(148,163,184,.12) calc(10% - 1px),rgba(148,163,184,.12) 10%)}
.staggerDot{position:absolute;top:50%;width:5px;height:14px;border-radius:4px;transform:translate(-50%,-50%);background:var(--a);box-shadow:0 0 10px rgba(56,189,248,.45);opacity:.28}
.staggerDot.major{height:20px;opacity:.9;background:var(--g);box-shadow:0 0 12px rgba(34,197,94,.4)}


.body{overflow-y:auto;overflow-x:hidden;min-height:0;flex:1;overscroll-behavior:contain}
.layers::-webkit-scrollbar,.body::-webkit-scrollbar{width:5px}
.layers::-webkit-scrollbar-track,.body::-webkit-scrollbar-track{background:transparent}
.layers::-webkit-scrollbar-thumb,.body::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
.body::-webkit-scrollbar-thumb:hover{background:var(--dim)}


.sec{padding:13px 15px;border-bottom:1px solid var(--line)}
.sec .st{cursor:pointer;list-style:none;user-select:none}
.sec .st::-webkit-details-marker{display:none}
.st{font-family:var(--m);font-size:10px;color:color-mix(in srgb,var(--txt) 68%,var(--a) 32%);letter-spacing:.08em;text-transform:uppercase;margin-bottom:0;display:flex;align-items:center;gap:8px;opacity:.95;font-weight:600}
.st::before{content:'\25B8';width:17px;color:var(--dim);font-size:16px;letter-spacing:0;line-height:1;flex:0 0 17px}
.sec[open]>.st{margin-bottom:11px}
.sec[open]>.st::before{content:'\25BE';color:var(--a)}
.st::after{content:'';flex:1;height:1px;background:color-mix(in srgb,var(--line) 82%,var(--line2) 18%)}


.row{display:grid;grid-template-columns:100px minmax(0,1fr) 54px;gap:8px;align-items:center;margin-bottom:8px}
.row:last-child{margin-bottom:0}
.row label{font-family:var(--m);font-size:10px;color:#90a5bd}
.row.wide{grid-template-columns:100px 1fr}.row.two{grid-template-columns:1fr 1fr}.row.check{grid-template-columns:100px auto 1fr}


input[type=range]{width:100%;-webkit-appearance:none;height:3px;background:linear-gradient(to right,var(--a) var(--pct,0%),var(--bg4) var(--pct,0%));border-radius:3px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--a);cursor:pointer;box-shadow:0 0 0 3px var(--ag);transition:box-shadow .15s,transform .1s}
input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 0 0 5px var(--ag);transform:scale(1.1)}


input[type=text],input[type=number],select{
  width:100%;
  background:rgba(255,255,255,.038);
  border:1px solid rgba(148,163,184,.13);
  border-radius:8px;
  color:#cbd5e1;
  padding:6px 8px;
  font-family:var(--m);
  font-size:11px;
  outline:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
  transition:border-color .12s,box-shadow .12s,background .12s,color .12s;
  color-scheme:dark;
}
input[type=number],input.val,.val,.status b,.lifeTicks,.lifeSegLabel{
  font-family:var(--num);
  font-variant-numeric:tabular-nums slashed-zero;
  font-feature-settings:"tnum" 1,"zero" 1;
}
select option{
  background:#10161f;
  color:#cbd5e1;
}
select option:checked{
  background:#0f3550;
  color:#e2f4ff;
}
select option:hover{
  background:#17202d;
  color:#e2e8f0;
}
input[type=text]::placeholder,input[type=number]::placeholder{color:#64748b}
input[type=text]:focus,input[type=number]:focus,select:focus{
  color:#e2e8f0;
  background:rgba(255,255,255,.045);
  border-color:rgba(56,189,248,.4);
  box-shadow:0 0 0 2px rgba(56,189,248,.08),inset 0 1px 0 rgba(255,255,255,.03);
}
input[type=color]{width:36px;height:24px;border:1px solid var(--line);border-radius:var(--r4);background:transparent;padding:1px;cursor:pointer}
input[type=checkbox]{width:14px;height:14px;accent-color:var(--a);cursor:pointer;color-scheme:dark}


.val{font-family:var(--m);font-size:11px;color:var(--a);text-align:right}
input.val{width:54px;padding:4px 5px;color:#cbd5e1;text-align:right}


.btn,.stateBtn,.tpRadio{background:var(--bg3);color:var(--mut);border-radius:var(--r4);font-family:var(--m);font-size:11px;cursor:pointer}
.btn{border:1px solid var(--line2);padding:6px 10px;text-decoration:none;white-space:nowrap;transition:all .12s}
.btn:hover{background:var(--bg4);color:var(--txt)}
.btn.act{border-color:var(--a2);color:var(--a);background:color-mix(in srgb,var(--a) 10%,var(--bg3))}
.btn.good{border-color:#1a5c42;color:var(--g);background:color-mix(in srgb,var(--g) 8%,var(--bg3))}
.btn.bad{border-color:#5c2020;color:var(--r);background:color-mix(in srgb,var(--r) 8%,var(--bg3))}
.btn.small{padding:4px 7px}
.tools{display:flex;gap:5px;flex-wrap:wrap}
.layerStateTools{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.stateBtn{min-width:24px;padding:3px 6px;border:1px solid var(--line)}
.stateBtn:hover{border-color:var(--line2);color:var(--mut)}
.stateBtn.muted{background:rgba(148,163,184,.12);border-color:#475569;color:#cbd5e1}
.stateBtn.solo{background:rgba(250,204,21,.12);border-color:#854d0e;color:#facc15}
.stateBtn.order{min-width:20px;padding:3px 5px;color:var(--dim)}
.stateBtn:disabled{opacity:.28;cursor:default}
.stateBadge{font-family:var(--m);font-size:10px;color:var(--dim);padding:2px 5px;border:1px solid var(--line);border-radius:var(--r4)}
.stateBadge.inactive{color:#64748b;border-color:#263244}
.groupHeader{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:7px;align-items:center;margin:7px 0}
.groupHeader input[type=text]{min-width:0}
.groupColor{width:24px;height:24px;padding:1px}
.timelineHint{font-family:var(--m);font-size:10px;color:var(--mut);line-height:1.35;margin-top:7px}
.hint{font-family:var(--m);font-size:11px;line-height:1.5;color:var(--mut);margin-top:7px}
.lifeSegments{position:relative;height:22px;border:1px solid var(--line);border-radius:7px;background:linear-gradient(90deg,rgba(56,189,248,.08),rgba(168,85,247,.08));overflow:hidden;margin:6px 0 8px}
.lifeSeg{position:absolute;top:4px;height:14px;border-radius:999px;background:rgba(244,114,182,.45);border:1px solid rgba(244,114,182,.8);box-shadow:0 0 10px rgba(244,114,182,.2)}
.lifeSeg.off{opacity:.28}
.lifeSegLabel{position:absolute;top:4px;font:10px var(--m);color:#fce7f3;white-space:nowrap;transform:translateX(4px);pointer-events:none}
.lifeTicks{display:flex;justify-content:space-between;font:9px var(--m);color:var(--mut);margin-top:-3px}


.fileControl{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;min-width:0}
.fileControl input{display:none}
.fileControl .fileName{font-family:var(--m);font-size:11px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fileControl .btn{position:relative;padding-left:22px}
.fileControl .btn::before{content:'+';position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--g);font-weight:600}


.right{grid-column:3;grid-row:1/3;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.bar{height:42px;border-bottom:1px solid var(--line);background:var(--bg2);display:flex;align-items:center;gap:8px;padding:0 13px;flex-shrink:0}
.bar .sp{flex:1}
.toolbarDivider{width:1px;height:22px;background:var(--line);margin:0 6px;flex-shrink:0}
.fxLogo{display:flex;align-items:baseline;gap:4px;margin-right:2px;padding:1px 0 3px;line-height:1;user-select:none}
.fxLogo span{font-family:'Amatic SC','Segoe Print','Bradley Hand',cursive;font-size:28px;font-weight:400;letter-spacing:.06em}
.fxLogo .fizz{color:rgba(255,255,255,.97);font-weight:700;text-shadow:0 0 2px rgba(255,255,255,.36),0 0 .8px rgba(255,255,255,.98),0 0 .8px rgba(255,255,255,.98),0 0 1.6px rgba(255,255,255,.88),0 0 1.6px rgba(255,255,255,.88)}
.fxLogo .fizz span:nth-child(1){letter-spacing:.02em;transform:translateY(1px) rotate(-1deg)}
.fxLogo .fizz span:nth-child(2){letter-spacing:.09em;transform:translateY(-1px)}
.fxLogo .fizz span:nth-child(3){letter-spacing:.04em;transform:rotate(1deg)}
.fxLogo .fizz span:nth-child(4){letter-spacing:.08em;transform:translateY(1px) rotate(-.5deg)}
.fxLogo .fizz span{display:inline-block}
.fxLogo .fx{display:inline-block;color:#a855f7;text-shadow:0 0 4px rgba(168,85,247,.82),0 0 10px rgba(168,85,247,.38),0 0 20px rgba(168,85,247,.16),0 0 30px rgba(168,85,247,.08);animation:fxNeonPulse 4.4s cubic-bezier(.42,0,.22,1) infinite}
@keyframes fxNeonPulse{
  0%,100%{opacity:1;text-shadow:0 0 4px rgba(168,85,247,.82),0 0 10px rgba(168,85,247,.38),0 0 20px rgba(168,85,247,.16),0 0 30px rgba(168,85,247,.08)}
  28%{opacity:.97;text-shadow:0 0 6px rgba(168,85,247,.9),0 0 14px rgba(168,85,247,.46),0 0 26px rgba(168,85,247,.2),0 0 38px rgba(168,85,247,.1)}
  52%{opacity:.93;text-shadow:0 0 2px rgba(168,85,247,.6),0 0 6px rgba(168,85,247,.28),0 0 12px rgba(168,85,247,.12),0 0 18px rgba(168,85,247,.05)}
  76%{opacity:.985;text-shadow:0 0 5px rgba(168,85,247,.86),0 0 12px rgba(168,85,247,.42),0 0 24px rgba(168,85,247,.18),0 0 34px rgba(168,85,247,.09)}
}
.projectGroup,.historyGroup{display:flex;align-items:center;gap:5px}
.iconBtn{min-width:30px;width:30px;height:28px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.iconBtn svg{width:14px;height:14px;display:block}
.timePill{min-width:58px;text-align:center;background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.28);border-radius:var(--r4);padding:6px 8px}
.viewerStage{position:relative;flex:1;min-height:0;display:flex;overflow:hidden}
.viewerBrand{display:none}
.viewerBrand .fxLogo{margin:0;padding:0}
.viewerBrand .fxLogo span{font-size:48px}
.viewerBrand .fxLogo .fizz{opacity:.96}
.viewerPlayback{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:8px;padding:6px;border:1px solid rgba(255,255,255,.06);border-radius:12px;background:rgba(11,16,24,.74);backdrop-filter:blur(8px)}
.playPauseBtn{width:44px;height:36px;padding:0;display:flex;align-items:center;justify-content:center}
.playPauseBtn svg{width:16px;height:16px;display:block}
.viewerPlayback .timePill{min-width:66px;padding:8px 10px}


.gizmoGroup{position:absolute;right:9px;top:10px;z-index:4;display:flex;flex-direction:column;gap:6px;padding:5px;border:1px solid rgba(255,255,255,.06);border-radius:var(--r6);background:rgba(11,16,24,.78);backdrop-filter:blur(6px)}
.gizmoBtn,.gizmoToolBtn{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center}
.gizmoBtn svg,.gizmoToolBtn svg{width:15px;height:15px;display:block}
.gizmoGroup .btn.act{border-color:var(--a2);color:#fff;background:color-mix(in srgb,var(--a) 42%,var(--bg3));box-shadow:0 0 14px rgba(56,189,248,.22)}
canvas{display:block}
#cv{flex:1;width:100%;height:100%;min-height:0;mix-blend-mode:var(--cv-blend,normal)}


#tl{height:52px;border-top:1px solid var(--line);flex-shrink:0;cursor:pointer;touch-action:none}


.status{height:30px;border-top:1px solid var(--line);background:var(--bg2);display:flex;align-items:center;gap:14px;padding:0 14px;flex-shrink:0}
.status span{font-family:var(--m);font-size:11px;color:var(--mut);display:flex;align-items:center;gap:5px}
.status b{color:var(--mut);font-weight:500;background:var(--bg3);padding:1px 7px;border-radius:10px;border:1px solid var(--line)}


.preset{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.preset .btn:first-child{flex:1;text-align:left}
details.presetGroup{border-bottom:1px solid var(--line)}
details.presetGroup summary{list-style:none;cursor:pointer;font-family:var(--m);font-size:11px;color:var(--mut);padding:8px 0;display:flex;align-items:center;gap:6px;transition:color .12s;user-select:none}
details.presetGroup summary:hover{color:var(--txt)}
details.presetGroup summary::-webkit-details-marker{display:none}
details.presetGroup summary::before{content:'';width:14px;height:14px;border:1px solid var(--line2);border-radius:3px;display:inline-block;flex-shrink:0;background:url("data:image/svg+xml,%3Csvg width='8' height='8' viewBox='0 0 8 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 1.5v5M1.5 4h5' stroke='%23718499' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E") center/8px no-repeat}
details.presetGroup[open] summary{color:var(--a)}
details.presetGroup[open] summary::before{border-color:var(--a2);background:url("data:image/svg+xml,%3Csvg width='8' height='8' viewBox='0 0 8 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1.5 4h5' stroke='%2338bdf8' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E") center/8px no-repeat}
details.presetGroup>*:not(summary){padding-bottom:8px}
.layerGroup{border-bottom:1px solid rgba(36,51,71,.55)}
.layerGroup summary{color:var(--mut);padding:7px 0}
.layerGroup summary::before{content:'\25B8';width:17px;height:auto;border:0;border-radius:0;background:none;color:var(--dim);font-size:16px;line-height:1;display:inline-block;flex:0 0 17px}
.layerGroup[open] summary{color:var(--mut)}
.layerGroup[open] summary::before{content:'\25BE';border:0;background:none;color:var(--mut)}
.flatLayerList{display:flex;flex-direction:column;gap:6px}
.layerRow>summary,.layerGroup>summary{justify-content:space-between;min-height:28px}
.layerRowName,.groupRowName{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.layerRow.muted,.layerGroup.muted{opacity:.52}
.layerRow.solo>summary,.layerGroup.solo>summary{color:#facc15}
.layerRow.inactive,.layerGroup.inactive{opacity:.34}
.layerRow .layerStateTools,.layerGroup .layerStateTools{margin-left:auto;flex-wrap:nowrap}
.layerRow .stateBadge,.layerGroup .stateBadge{display:none}


.curveBox{height:86px;border:1px solid var(--line);border-radius:var(--r4);background:#070b12;margin:8px 0 2px;position:relative;overflow:hidden;clear:both}
.curveBox canvas{width:100%;height:100%;display:block;cursor:crosshair}
.curveLabel{font-family:var(--m);font-size:10px;color:var(--mut);margin-top:6px}
.curveZoomOverlay{position:fixed;inset:0;z-index:80;background:transparent;pointer-events:none}
.curveZoomPanel{position:fixed;pointer-events:auto;max-height:min(520px,calc(100vh - 72px));overflow:auto;border:1px solid rgba(56,189,248,.32);border-radius:10px;background:linear-gradient(180deg,rgba(10,16,26,.96),rgba(6,10,18,.96));backdrop-filter:blur(14px);box-shadow:0 18px 62px rgba(0,0,0,.5),0 0 34px rgba(56,189,248,.1);padding:14px}
.curveZoomTop{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 0 10px;border-bottom:1px solid var(--line)}
.curveZoomTitle{font-family:var(--m);font-size:13px;color:var(--a);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.curveZoomBody{padding-top:10px}
.curveZoomBody .curveBox{height:min(300px,38vh);margin-top:10px}
.curveZoomBody .curveLabel{font-size:12px;color:#9fdcff}
.curveZoomBody .hint{font-size:11px}
.curveZoomBody .row.wide{grid-template-columns:180px 1fr}
.curveZoomBtn{min-width:38px;height:20px;padding:0 8px!important;font-size:10px!important;line-height:18px;color:#9ab5c8!important;border-color:rgba(148,163,184,.22)!important;background:rgba(255,255,255,.018)!important;box-shadow:none!important;text-transform:uppercase;letter-spacing:.04em}
.curveZoomBtn:hover{color:#d8ecff!important;border-color:rgba(56,189,248,.38)!important;background:rgba(56,189,248,.055)!important;box-shadow:0 0 10px rgba(56,189,248,.08)!important}


.gradientEditor{border:1px solid var(--line);border-radius:var(--r4);background:#070b12;padding:10px;margin-bottom:10px}
.gradientPreview{position:relative;height:46px;border:1px solid var(--line2);border-radius:var(--r4);overflow:hidden;background-color:#111827;background-image:linear-gradient(45deg,#0b1018 25%,transparent 25%),linear-gradient(-45deg,#0b1018 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#0b1018 75%),linear-gradient(-45deg,transparent 75%,#0b1018 75%);background-size:16px 16px;background-position:0 0,0 8px,8px -8px,-8px 0}
.gradientPreview canvas{width:100%;height:100%}
.gradMarks{position:relative;height:18px;margin:2px 6px}
.gradMarker{position:absolute;top:2px;width:12px;height:12px;border:1px solid #07101c;background:var(--txt);transform:translateX(-50%) rotate(45deg);border-radius:2px;cursor:pointer;box-shadow:0 0 0 1px var(--line2);transition:box-shadow .12s,transform .12s}
.gradMarker.alpha{border-radius:50%;transform:translateX(-50%);background:linear-gradient(#fff,#7c8796)}
.gradMarker.on{box-shadow:0 0 0 2px var(--a),0 0 12px var(--ag);transform:translateX(-50%) rotate(45deg) scale(1.15)}
.gradMarker.alpha.on{transform:translateX(-50%) scale(1.15)}
.gradControls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.gradControls .row{margin-bottom:0}
.gradButtons{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.gradientHint{font-family:var(--m);font-size:10px;color:var(--mut);margin-top:7px;line-height:1.35}
.stopPanel{border:1px solid var(--line);border-radius:var(--r4);background:var(--bg3);padding:9px;margin-top:9px}
.stopTitle{font-family:var(--m);font-size:9px;color:var(--a);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
input.bigColor[type=color]{width:100%;height:38px;padding:2px}


.texPreview{height:130px;border:1px solid var(--line);border-radius:var(--r4);background:#070b12;margin-bottom:10px;display:grid;place-items:center;overflow:hidden}
.texPreview canvas{width:110px;height:110px;image-rendering:auto}
.variantList{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.variantSlot{display:grid;grid-template-columns:42px minmax(0,1fr) 58px auto;gap:7px;align-items:center;border:1px solid var(--line);border-radius:var(--r6);background:rgba(255,255,255,.025);padding:7px}
.variantSlot.exportVariantSlot{grid-template-columns:42px minmax(0,1fr) auto}
.variantSlot.exportVariantSlot input[type=text]{min-width:0}
.variantSlot.unavailable{opacity:.42;filter:saturate(.45)}

.variantThumb{width:42px;height:42px;border:1px solid var(--line2);border-radius:var(--r4);background:#070b12;display:grid;place-items:center;overflow:hidden}
.variantThumb canvas{width:36px;height:36px}
.variantTools{display:flex;gap:5px;justify-content:flex-end;align-items:center}
.variantTools input[type=file]{display:none}
.variantWeight{display:flex;flex-direction:column;gap:3px}
.variantWeight span{font-family:var(--m);font-size:9px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.variantWeight input{width:58px}


details.advanced{border:1px solid var(--line);border-radius:var(--r4);background:#0c1420;margin:9px 0 0;padding:0 9px}
details.advanced summary{cursor:pointer;list-style:none;font-family:var(--m);font-size:11px;color:var(--mut);padding:8px 0}
details.advanced summary::-webkit-details-marker{display:none}
details.advanced summary::after{content:'+';float:right;color:var(--dim)}

.advancedBody{border-top:1px solid var(--line);padding:9px 0 10px}


#cv{cursor:grab}#cv.dragging{cursor:grabbing}
.hidden{display:none}
.floatingToggle{position:absolute;right:10px;top:10px;z-index:2}


#tweaksPanel{position:fixed;bottom:44px;right:20px;width:224px;background:var(--bg2);border:1px solid var(--line2);border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.04);z-index:1000;display:none;overflow:hidden;animation:tpIn .15s ease}
#tweaksPanel.open{display:block}
@keyframes tpIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tpHead{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.tpHead span{font-family:var(--m);font-size:11px;color:var(--a);letter-spacing:.1em;text-transform:uppercase}
.tpClose{background:none;border:none;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px;border-radius:3px}
.tpClose:hover{color:var(--txt);background:var(--bg3)}
.tpBody{padding:12px 14px;display:flex;flex-direction:column;gap:14px}
.tpSection{display:flex;flex-direction:column;gap:7px}
.tpLabel{font-family:var(--m);font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.tpRadioGroup{display:flex;gap:3px}
.tpRadio{flex:1;padding:5px 4px;border:1px solid var(--line);text-align:center;transition:all .12s}
.tpRadio.on{background:color-mix(in srgb,var(--a) 12%,var(--bg3));border-color:var(--a2);color:var(--a)}
.tpSwatches{display:flex;gap:8px;align-items:center}
.tpSwatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:transform .12s,border-color .12s;outline:none}
.tpSwatch:hover{transform:scale(1.1)}
.tpSwatch.on{border-color:rgba(255,255,255,.8);transform:scale(1.12)}


.presetGrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px 0 8px}
.presetCard{border:1px solid var(--line);border-radius:var(--r6);overflow:hidden;cursor:pointer;background:var(--bg3);transition:border-color .15s,box-shadow .15s}
.presetCard:hover{border-color:var(--a2);box-shadow:0 4px 20px rgba(0,0,0,.4)}
.presetSwatch{height:54px;width:100%;display:block;object-fit:cover;background:#06090f}
.presetCardBody{padding:5px 8px 6px}
.presetCardName{font-family:var(--m);font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s}
.presetCard:hover .presetCardName{color:var(--txt)}
.presetCardActions{display:flex;gap:3px;margin-top:5px;min-height:24px;overflow:visible}
.presetCard:hover .presetCardActions{min-height:24px}
.presetCardWide{grid-column:1/-1}
.myPresetRow{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.myPresetRow .btn:first-child{flex:1;text-align:left}


@keyframes panelFadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.body.panelAnim{animation:panelFadeIn .18s ease both}


.resizeHandle{
  position:absolute;right:-4px;top:0;width:8px;height:100%;
  cursor:col-resize;z-index:50;
}
.resizeHandle:hover::after,.resizeHandle.dragging::after{
  content:'';position:absolute;left:3px;top:0;width:2px;height:100%;

}
.resizeHandleLeft{
  position:absolute;left:-4px;top:0;width:8px;height:100%;
  cursor:col-resize;z-index:50;
}
.resizeHandleLeft:hover::after,.resizeHandleLeft.dragging::after{
  content:'';position:absolute;left:3px;top:0;width:2px;height:100%;
  background:var(--a);border-radius:1px;opacity:.6;
}</style>

<body>
<div class="layout" id="layout">
  <div class="appTop">
    <div class="fxLogo" aria-label="FizzFX"><span class="fizz"><span>F</span><span>I</span><span>Z</span><span>Z</span></span><span class="fx">FX</span></div>
    <div class="toolbarDivider"></div>
    <div class="projectGroup">

    </div>

    <div class="historyGroup">
      <button class="btn small iconBtn" id="undoBtn" title="Undo (Ctrl+Z)" disabled><svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5 3.5 8.5 7 12"/><path d="M4 8.5h6.4a3.6 3.6 0 0 1 0 7.2H9"/></svg></button>

<script>const FPS=30,ONE_FRAME=1/FPS,MAX_LAYERS=20,MAX_SCATTER_ANGLE=Math.PI*.35,LETTERS='ABCDEFGHIJKLMNOPQRSTUVWXYZ',PROJECT_APP='FizzFX',PROJECT_VERSION=1,CUSTOM_PRESETS_KEY='fizzfxCustomPresets_v1',OLD_CUSTOM_PRESETS_KEY='spineParticlePresets',BUILTIN_OVERRIDE_KEY='spineParticleBuiltinOverrides_v2',PRESET_IDB_DB='FizzFXStorage',PRESET_IDB_STORE='kv';
const ANIMATION_MODES=['single','introLoopOutro'],PHASES=['intro','loop','outro'],PREVIEW_PHASES=['intro','loop','outro','full'],PHASE_FADE_MODES=['none','alpha','scale','both'];
const ENABLE_PERF_DIAGNOSTICS=false;
const FEATURES={
turbulence:true,
vortex:true,
trajectoryPath:true,
layerTiming:true,
groups:true,
exportValidation:true
};

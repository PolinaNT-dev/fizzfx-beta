<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FizzFX Access</title>
  <style>
    :root{color-scheme:dark;--bg:#06090f;--panel:#0b1018;--line:#1b2636;--text:#d7e4f2;--mut:#7b8da2;--a:#38bdf8;--bad:#fb7185}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0%,rgba(56,189,248,.12),transparent 34%),var(--bg);font:14px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    .card{width:min(420px,calc(100vw - 32px));border:1px solid var(--line);border-radius:10px;background:rgba(11,16,24,.96);box-shadow:0 24px 80px rgba(0,0,0,.42);padding:24px}
    h1{margin:0 0 6px;font-size:24px;letter-spacing:.02em}
    p{margin:0 0 18px;color:var(--mut);line-height:1.45}
    .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
    button,input{font:inherit}
    .tab,.submit{height:38px;border-radius:6px;border:1px solid var(--line);background:#10161f;color:var(--mut);cursor:pointer}
    .tab.active,.submit{border-color:#0369a1;background:#075985;color:white}
    label{display:block;margin:12px 0 6px;color:#9fb2c8;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
    input{width:100%;height:40px;border:1px solid var(--line);border-radius:6px;background:#070b12;color:var(--text);padding:0 11px;outline:none}
    input:focus{border-color:var(--a);box-shadow:0 0 0 2px rgba(56,189,248,.12)}
    .submit{width:100%;margin-top:18px}
    .submit:disabled{opacity:.65;cursor:wait}
    .status{min-height:22px;margin-top:14px;color:var(--mut);line-height:1.4}
    .status.bad{color:var(--bad)}
    .brand{font-weight:700;color:white}
    .footer{margin-top:18px;font-size:12px;color:#64748b}
  </style>
</head>
<body>
  <main class="card">
    <h1><span class="brand">FizzFX</span> Access</h1>
    <p>Sign in or create an account to open the beta editor.</p>

    <div class="tabs">
      <button class="tab active" id="signinTab" type="button">Sign in</button>
      <button class="tab" id="signupTab" type="button">Create account</button>
    </div>

    <form id="authForm">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required>

      <button class="submit" id="submitBtn" type="submit">Sign in</button>
    </form>

    <div class="status" id="status"></div>
    <div class="footer">Access is protected by FizzFX authentication.</div>
  </main>

  <script>
    const statusEl = document.getElementById('status');
    const submitBtn = document.getElementById('submitBtn');
    const signinTab = document.getElementById('signinTab');
    const signupTab = document.getElementById('signupTab');
    const form = document.getElementById('authForm');
    let mode = 'signin';
    let config = null;

    const rawNext = new URLSearchParams(location.search).get('next') || '/';
    const next = rawNext.startsWith('/login') ? '/' : rawNext;

    function setStatus(message, bad = false) {
      statusEl.textContent = message || '';
      statusEl.classList.toggle('bad', !!bad);
    }

    function setMode(nextMode) {
      mode = nextMode;
      signinTab.classList.toggle('active', mode === 'signin');
      signupTab.classList.toggle('active', mode === 'signup');
      submitBtn.textContent = mode === 'signin' ? 'Sign in' : 'Create account';
      setStatus('');
    }

    async function loadConfig() {
      const res = await fetch('/auth/config');
      if (!res.ok) throw new Error('Auth is not configured yet.');
      config = await res.json();
    }

    async function supabaseRequest(path, body) {
      const res = await fetch(config.supabaseUrl + path, {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          'apikey': config.supabaseAnonKey
        },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error_description || data.msg || data.message || 'Authentication failed.');
      return data;
    }

    async function createServerSession(session) {
      const res = await fetch('/auth/session', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          access_token: session.access_token,
          refresh_token: session.refresh_token,
          expires_in: session.expires_in
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || 'Could not create session.');
    }

    signinTab.addEventListener('click', () => setMode('signin'));
    signupTab.addEventListener('click', () => setMode('signup'));

    form.addEventListener('submit', async event => {
      event.preventDefault();
      submitBtn.disabled = true;
      setStatus(mode === 'signin' ? 'Signing in...' : 'Creating account...');

      try {
        if (!config) await loadConfig();
        const email = form.email.value.trim();
        const password = form.password.value;
        const data = mode === 'signin'
          ? await supabaseRequest('/auth/v1/token?grant_type=password', { email, password })
          : await supabaseRequest('/auth/v1/signup', { email, password });
        const session = data.session || data;
        if (!session || !session.access_token) {
          setStatus('Account created. Check your email to confirm access.');
          return;
        }
        await createServerSession(session);
        location.assign(next);
      } catch (err) {
        setStatus(err.message || String(err), true);
      } finally {
        submitBtn.disabled = false;
      }
    });

    loadConfig().catch(err => setStatus(err.message || String(err), true));
  </script>
</body>
</html>
